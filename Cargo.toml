[workspace]
resolver = "2"
members = [
    "plugins/data_source/*",
    "plugins/data_sink/*",
    "plugins/schema_sink/*",
    "plugins/shared/api_source",
]

[workspace.dependencies]
async-trait = "0.1.77"
arrow-array = "59.2.0"
base64 = "0.22.1"
arrow = { version = "59.2.0", features = ["ipc_compression", "json"] }
arrow-flight = { version = "59.2.0", default-features = false, features = ["flight-sql"] }
arrow-schema = "59.2.0"
arrow-buffer = "59.2.0"
bytes = "1.5.0"
clap = { version = "4.0.32", features = ["derive"] }
dashmap = "5.5.3"
datafusion = "55.2.0"
datafusion-distributed = "4.0.0"
futures = "0.3.25"
futures-util = "0.3"
hex = "0.4.3"
sha2 = "0.10"
md5 = "0.7.0"
native-tls = "0.2.18"
once_cell = "1.17.0"
parquet = "59.2.0"
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp"] }
pgwire-replication = "0.3.0"
postgres-native-tls = "0.5.2"
serde = "1.0.105"
serde_derive = "1.0.105"
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.16"
tokio-tungstenite = "0.21"
tracing = "0.1"
tungstenite = "0.21"
thiserror = "1.0.58"
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
skippr-runtime-sdk = { path = ".host/crates/skippr-runtime-sdk" }
skippr-plugin-macros = { path = ".host/crates/skippr-plugin-macros" }
skippr-object-writer = { path = ".host/crates/skippr-object-writer" }
skippr-iceberg-writer = { path = ".host/crates/skippr-iceberg-writer" }
skippr-iceberg-catalog = { path = ".host/crates/skippr-iceberg-catalog" }
skippr-iceberg-catalog-fs = { path = ".host/crates/skippr-iceberg-catalog-fs" }
skippr-iceberg-catalog-glue = { path = ".host/crates/skippr-iceberg-catalog-glue" }
skippr-iceberg-catalog-dynamodb = { path = ".host/crates/skippr-iceberg-catalog-dynamodb" }
skippr-lease = { path = ".host/crates/skippr-lease" }

[profile.release]
debug = false
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch.crates-io]
iceberg = { path = ".host/third_party/iceberg" }
